<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{pluResPath}}html/endeavors/endeavors.css" />
  <link rel="shortcut icon" href="#" />
</head>
<body>
  <div class="container" id="container">
    <div class="header">
      <h1 class="title">勉励任务</h1>
      <div class="update-time">更新时间：{{updateTime}}</div>
    </div>

    <div class="section daily-section">
      <h2 class="section-title">每日勉励</h2>
      <div class="task-list">
        {{each daily item}}
        <div class="task-item">
          <div class="task-name-cn">{{item.name_cn}}</div>
          <div class="task-name-en">{{item.name_en}}</div>
          <div class="task-meta">
            <span class="rewards">奖励：{{item.rewards}} <img class="endeavor-icon" src="{{pluResPath}}img/icon/endeavor.png" alt="" /></span>
            <span class="time">{{item.time}}</span>
          </div>
        </div>
        {{/each}}
      </div>
    </div>

    <div class="section weekly-section">
      <h2 class="section-title">每周勉励</h2>
      <div class="task-list">
        {{each weekly item}}
        <div class="task-item">
          <div class="task-name-cn">{{item.name_cn}}</div>
          <div class="task-name-en">{{item.name_en}}</div>
          <div class="task-meta">
            <span class="rewards">奖励：{{item.rewards}} <img class="endeavor-icon" src="{{pluResPath}}img/icon/endeavor.png" alt="" /></span>
            <span class="time">{{item.time}}</span>
          </div>
        </div>
        {{/each}}
      </div>
    </div>

    <div class="footer">ESO-Bot · 数据来源 api.esocn.com.cn</div>
  </div>
</body>
</html>
