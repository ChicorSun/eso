<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{pluResPath}}html/steam/gameEnd.css" />
  <link rel="shortcut icon" href="#" />
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Steam 动态</span>
      <span class="time">{{updateTime}}</span>
    </div>

    <div class="player-row">
      {{if avatarImagePath}}
      <img class="avatar" src="{{pluResPath}}../../../data/eso/custome_resources/steam/images/avatar/{{avatarImagePath}}" alt="" onerror="this.style.visibility='hidden'" />
      {{/if}}
      <div class="player-info">
        <div class="player-name">{{name}}</div>
        <div class="action-text">结束了《{{game}}》的游玩</div>
      </div>
    </div>

    <div class="stats-card">
      {{if durationText}}
      <div class="stat-item">
        <div class="stat-value">{{durationText}}</div>
        <div class="stat-label">本次游玩时长</div>
      </div>
      {{/if}}
      {{if startTimeText}}
      <div class="stat-item">
        <div class="stat-value">{{startTimeText}}</div>
        <div class="stat-label">开始时间</div>
      </div>
      {{/if}}
      {{if endTimeText}}
      <div class="stat-item">
        <div class="stat-value">{{endTimeText}}</div>
        <div class="stat-label">结束时间</div>
      </div>
      {{/if}}
    </div>

    <div class="footer">ESO-Bot · Steam 状态监控</div>
  </div>
</body>
</html>
