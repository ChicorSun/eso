<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{pluResPath}}html/steam/steam.css" />
  <link rel="shortcut icon" href="#" />
</head>
{{@headStyle}}

<body>
  <div class="container" id="container">
    <!-- ID Card Content -->
    <div class="id_card">
      {{if userInfo}}
      <!-- User Info Section -->
      <div class="user_section">
        <!-- Avatar -->
        <div class="avatar_container">
          <img src="{{userInfo.avatarfull}}" alt="头像" class="user_avatar" />
        </div>
        
        <!-- User Details -->
        <div class="user_details">
          <div class="user_name">{{userInfo.personaname}}</div>
          <div class="user_status">
            <span class="status_icon {{statusClass}}"></span>
            <span class="status_text">{{statusText}}</span>
          </div>
          <div class="user_friend_code">{{friendCode}}</div>
          <div class="user_register_time">{{registerTime}}</div>
        </div>
      </div>

      <!-- Game Status Section -->
      <div class="game_section">
        {{if userInfo.gameextrainfo}}
        <div class="game_info">
          <div class="game_image">
            <img src="{{gameImage}}" alt="游戏图片" />
          </div>
          <div class="game_details">
            <div class="game_status">游戏中...</div>
            <div class="game_name">{{userInfo.gameextrainfo}}</div>
          </div>
        </div>
        {{else}}
        <div class="no_game">
          <div class="no_game_text">当前尚未游玩</div>
        </div>
        {{/if}}
      </div>
      {{else}}
      <div class="error_message">
        <div class="error_text">无法获取用户信息</div>
      </div>
      {{/if}}
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer_text">Created By ESO-Bot Steam Plugin {{date}}</div>
    </div>
  </div>
</body>
</html>
