<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{pluResPath}}html/speech/speechChart.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <link rel="shortcut icon" href="#" />
</head>
{{@headStyle}}

<body>
  <div class="container" id="container">
    {{each speechData val index}}
    {{if index==0}}
    <style> .container { background: url("{{pluResPath}}img/background/{{val.pic}}.png") #fff; background-repeat: no-repeat; background-size: 100% 100%; }</style>
    {{else}}
    <div class="item">
      <div class="box">
        <div class="chart-container">
          <div class="top">
            <div class="title">{{val.title}}</div>
            <div class="valueType">{{val.type}}</div>
          </div>
          <div class="chart-wrapper">
            <canvas id="speechChart"></canvas>
          </div>
          <div class="legend">
            {{each val.users item}}
            <div class="legend-item">
              <span class="legend-color" style="background-color: {{item.color}};"></span>
              <img class="legend-avatar" src="{{pluResPath}}img/avatar/{{item.avatar}}.png" alt="{{item.name}}" />
              <span class="legend-name">{{item.name}}</span>
            </div>
            {{/each}}
          </div>
        </div>
      </div>
    </div>
    {{/if}}
    {{/each}}
    <div class="logo">Created By ESO-Bot</div>
  </div>

  <script>
    const ctx = document.getElementById('speechChart');
    const pluResPath = '{{pluResPath}}';
    const chartData = {
      labels: [{{each speechData[1].months item}}'{{item}}'{{if !$last}},{{/if}}{{/each}}],
      datasets: [
        {{each speechData[1].users user userIndex}}
        {
          label: '{{user.name}}',
          data: [{{each user.data item}}{{item}}{{if !$last}},{{/if}}{{/each}}],
          borderColor: '{{user.color}}',
          backgroundColor: '{{user.color}}33',
          borderWidth: 2,
          fill: false,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 5,
          avatar: '{{pluResPath}}img/avatar/{{user.avatar}}.png'
        }{{if !$last}},{{/if}}
        {{/each}}
      ]
    };

    new Chart(ctx, {
      type: 'line',
      data: chartData,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: 'rgba(0, 0, 0, 0.8)',
            titleColor: '#fff',
            bodyColor: '#fff',
            borderColor: '#666',
            borderWidth: 1,
            padding: 10,
            callbacks: {
              label: function(context) {
                return context.dataset.label + ': ' + context.parsed.y + '次';
              }
            }
          }
        },
        scales: {
          x: {
            display: true,
            grid: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            ticks: {
              color: '#CCCCCC',
              font: {
                size: 10
              },
              maxRotation: 45,
              minRotation: 45
            }
          },
          y: {
            display: true,
            beginAtZero: true,
            grid: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            ticks: {
              color: '#CCCCCC',
              font: {
                size: 12
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
