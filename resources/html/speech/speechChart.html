<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{pluResPath}}html/speech/speechChart.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <link rel="shortcut icon" href="#" />
</head>
{{@headStyle}}

<body>
  <div class="container" id="container">
    {{each speechData val index}}
    {{if index==0}}
    <style> .container { background: url("{{pluResPath}}img/background/{{val.pic}}.png") #fff; background-repeat: no-repeat; background-size: 100% 100%; }</style>
    {{else}}
    <div class="item">
      <div class="box">
        <div class="chart-container">
          <div class="top">
            <div class="title">{{val.title}}</div>
            <div class="valueType">{{val.type}}</div>
          </div>
          <div class="chart-wrapper">
            <canvas id="speechChart"></canvas>
          </div>
          <div class="legend">
            {{each val.users item}}
            <div class="legend-item">
              <span class="legend-color" style="background-color: {{item.color}};"></span>
              <img class="legend-avatar" src="{{pluResPath}}img/avatar/{{item.avatar}}.png" alt="{{item.name}}" />
              <span class="legend-name">{{item.name}}</span>
            </div>
            {{/each}}
          </div>
        </div>
      </div>
    </div>
    {{/if}}
    {{/each}}
    <div class="logo">Created By ESO-Bot</div>
  </div>

  <script>
    // 标记图表已渲染完成
    window.chartReady = false;
    
    const ctx = document.getElementById('speechChart');
    const pluResPath = '{{pluResPath}}';
    const chartData = {
      labels: [{{each speechData[1].months item}}'{{item}}'{{if !$last}},{{/if}}{{/each}}],
      datasets: [
        {{each speechData[1].users user userIndex}}
        {
          label: '{{user.name}}',
          data: [{{each user.data item}}{{item}}{{if !$last}},{{/if}}{{/each}}],
          borderColor: '{{user.color}}',
          backgroundColor: '{{user.color}}33',
          borderWidth: 2,
          fill: false,
          tension: 0.3,
          pointRadius: 0,
          pointHoverRadius: 0,
          pointHoverBackgroundColor: 'transparent',
          pointHoverBorderColor: 'transparent',
          pointHoverBorderWidth: 0,
          avatar: '{{pluResPath}}img/avatar/{{user.avatar}}.png'
        }{{if !$last}},{{/if}}
        {{/each}}
      ]
    };

    // 优化配置，仅保留静态渲染（用于截图）
    const chartOptions = {
      responsive: true,
      maintainAspectRatio: false,
      // 完全禁用动画
      animation: false,
      // 禁用所有交互
      interaction: {
        intersect: false,
        mode: 'nearest',
        // 禁用所有鼠标交互
        events: []
      },
      // 禁用悬停效果
      onHover: null,
      plugins: {
        legend: {
          display: false
        },
        // 完全禁用tooltip
        tooltip: {
          enabled: false
        },
        // 禁用所有插件交互
        decimation: {
          enabled: false
        }
      },
      scales: {
        x: {
          display: true,
          grid: {
            display: false  // 禁用网格线，减少绘制
          },
          ticks: {
            color: '#CCCCCC',
            font: {
              size: 10
            },
            maxRotation: 45,
            minRotation: 45,
            maxTicksLimit: 12  // 限制刻度数量
          }
        },
        y: {
          display: true,
          beginAtZero: true,
          grid: {
            color: 'rgba(255, 255, 255, 0.1)',
            drawBorder: false
          },
          ticks: {
            color: '#CCCCCC',
            font: {
              size: 12
            },
            maxTicksLimit: 8  // 限制Y轴刻度数量
          }
        }
      },
      // 禁用所有事件监听
      events: []
    };

    try {
      const chart = new Chart(ctx, {
        type: 'line',
        data: chartData,
        options: chartOptions
      });
      
      // 等待图表渲染完成
      chart.update('none');  // 立即更新，不使用动画
      
      // 标记图表已准备好
      window.chartReady = true;
      
      // 通知父窗口（如果使用iframe）
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'chartReady' }, '*');
      }
    } catch (error) {
      console.error('Chart rendering error:', error);
      window.chartReady = true;  // 即使出错也标记为完成，避免无限等待
    }
    
    // 设置超时保护，确保页面不会无限等待
    setTimeout(() => {
      if (!window.chartReady) {
        window.chartReady = true;
        console.warn('Chart rendering timeout');
      }
    }, 10000);  // 10秒超时
  </script>
</body>
</html>
